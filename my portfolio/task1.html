    <title>IIT Guwahati</title>

    <style>

        .navbar { /* atyling navigation bar */
            width: 100%;
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);

            position: sticky;
            top: 0;
            z-index: 1000;

            /* Shrinks the navbar while scrolling */
            animation: shrinkNavbar linear both;
            animation-timeline: scroll(root);
            animation-range: 0px 300px;
        }

        .nav-link { /* styling naavvigation bar elements */
            height: 100%;

            display: flex;
            align-items: center;

            padding: 0 14px;

            color: #ece4dc;
            text-decoration: none;
            background-color: crimson;

            font-size: 17px;
            white-space: nowrap;

            /* Shrinks the text while scrolling */
            animation: shrinkText linear both;
            animation-timeline: scroll(root);
            animation-range: 0px 300px;
        }


        /* Space between text and arrow */

        .nav-link span {
            margin-left: 5px;
        }

        .home {
            font-size: 50 px; /* home icon size */
        }

        @keyframes shrinkNavbar { /*to shrink the navigation bar */

            from {
                height: 54px;
            }

            to {
                height: 35px;
            }

        }

        @keyframes shrinkText { /*to shrink the text */

            from {
                font-size: 17px;
            }

            to {
                font-size: 13px;
            }

        }
    h3{
        text-align: center;
    }

    </style>

</head>
