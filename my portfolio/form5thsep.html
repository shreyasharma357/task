<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Student Registration</title>

    <style>

        /* ===== GENERAL ===== */

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
        }


        /* ===== FORM CONTAINER ===== */

        form {
            background-color: white;
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }


        /* ===== LOGIN FORM ===== */

        form:first-of-type {
            max-width: 400px;
        }


        /* ===== LABELS ===== */

        label {
            font-weight: bold;
            color: #444;
        }


        /* ===== INPUTS ===== */

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #333;
        }


        /* ===== CAPTCHA ===== */

        #captcha {
            margin-top: 10px;
        }


        /* ===== FIELDSET ===== */

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            font-size: 18px;
            padding: 0 8px;
            color: #222;
        }


        /* ===== RADIO BUTTONS ===== */

        input[type="radio"] {
            margin-left: 10px;
        }


        /* ===== CHECKBOXES ===== */

        input[type="checkbox"] {
            margin-right: 5px;
        }


        label[for="captcha"] {
            display: inline-block;
            margin-bottom: 5px;
        }


        button,
        input[type="submit"] {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background-color: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover,
        input[type="submit"]:hover {
            background-color: #444;
        }

        button[type="reset"] {
            background-color: #777;
        }

        button[type="reset"]:hover {
            background-color: #555;
        }


        form:first-of-type input[type="submit"] {
            width: 100%;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            form {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            fieldset {
                padding: 15px;
            }

        }

    </style>
</head>


<body>


    <h1>Login Form</h1>

    <p>Hello! Please login to continue.</p>

    <form>
        <label for="login">Login:</label>
        <br>
        <input type="text" id="login" name="login"
               placeholder="Enter your username" required>

        <br><br>
        <label for="password">Password:</label>
        <br>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>

        <br><br>
        <label for="captcha">CAPTCHA: 7K9P2</label>
        <br>
        <input type="text" id="captcha" name="captcha"
               placeholder="Enter CAPTCHA" required>

        <br><br>
        <input type="submit" value="Submit">

    </form>

    <h1>Student Registration Form</h1>

    <form>

        <fieldset>

            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number">

            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <br><br>

            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

        </fieldset>

        <fieldset>

            <legend>Education</legend>

            <label for="course">Select Course:</label>

            <select id="course" name="course">

                <option value="">-- Select Course --</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="bba">BBA</option>
                <option value="mca">MCA</option>
                <option value="mba">MBA</option>

            </select>

            <br><br>

            <label for="college">College Name:</label>
            <input type="text" id="college" name="college">

            <br><br>

            <label for="percentage">12th Percentage:</label>
            <input type="number" id="percentage" name="percentage"
                   min="0" max="100">

        </fieldset>

        <fieldset>

            <legend>Address</legend>

            <label for="address">Address:</label>
            <br>

            <textarea id="address" name="address"
                      rows="4"
                      placeholder="Enter your complete address"></textarea>

            <br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city">

            <br><br>

            <label for="state">State:</label>
            <input type="text" id="state" name="state">

            <br><br>

            <label for="pincode">PIN Code:</label>
            <input type="text" id="pincode" name="pincode">

        </fieldset>


        <!-- Interests -->

        <fieldset>

            <legend>Interests</legend>

            <label>Select your interests:</label>

            <br><br>

            <input type="checkbox" id="coding"
                   name="interest" value="coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="gaming"
                   name="interest" value="gaming">
            <label for="gaming">Gaming</label>

            <input type="checkbox" id="music"
                   name="interest" value="music">
            <label for="music">Music</label>

            <input type="checkbox" id="sports"
                   name="interest" value="sports">
            <label for="sports">Sports</label>

        </fieldset>


        <!-- Account -->

        <fieldset>

            <legend>Account</legend>

            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password"
                   name="password" required>

            <br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume">

        </fieldset>


        <!-- Terms -->

        <input type="checkbox" id="terms" name="terms" required>

        <label for="terms">
            I agree to the terms and conditions.
        </label>

        <br><br>


        <!-- Buttons -->

        <button type="submit">Register</button>

        <button type="reset">Reset</button>

    </form>

</body>

</html>
